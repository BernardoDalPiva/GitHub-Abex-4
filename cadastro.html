<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Minha Biblioteca</title>
    <link rel="stylesheet" href="style.css"> <style>
        /* Estilos adicionais para centralizar o formulário */
        body { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .auth-container { width: 100%; max-width: 400px; }
        .error-message { color: #cc0000; margin-bottom: 10px; text-align: center; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div id="formulario">
            <h2>Crie sua Conta</h2>
            <div id="error-div" class="error-message"></div>
            <form id="form-cadastro">
                <input type="text" id="nome" placeholder="Nome completo" required>
                <input type="email" id="email" placeholder="E-mail" required>
                <input type="text" id="cpf" placeholder="CPF (apenas números)" required>
                <input type="password" id="senha" placeholder="Senha (mín. 8 caracteres)" required>
                <input type="password" id="confirmar_senha" placeholder="Confirme a senha" required>
                <button type="submit">Cadastrar</button>
            </form>
            <p style="text-align: center; margin-top: 15px;">
                Já tem uma conta? <a href="login.html">Faça login</a>
            </p>
        </div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:5000';
        const form = document.getElementById('form-cadastro');
        const errorDiv = document.getElementById('error-div');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            errorDiv.textContent = ''; // Limpa erros antigos

            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const cpf = document.getElementById('cpf').value;
            const senha = document.getElementById('senha').value;
            const confirmar_senha = document.getElementById('confirmar_senha').value;

            // Validação no frontend (ajuda o usuário, mas a principal é no backend)
            if (senha !== confirmar_senha) {
                errorDiv.textContent = 'As senhas não coincidem!';
                return;
            }
            if (senha.length < 8) {
                errorDiv.textContent = 'A senha precisa ter no mínimo 8 caracteres.';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/cadastro`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, email, cpf, senha, confirmar_senha })
                });

                const data = await response.json();

                if (response.ok) {
                    alert(data.mensagem);
                    window.location.href = 'login.html'; // Redireciona para o login
                } else {
                    errorDiv.textContent = data.erro; // Mostra erro vindo da API
                }
            } catch (error) {
                errorDiv.textContent = 'Não foi possível conectar ao servidor.';
            }
        });
    </script>
</body>
</html>
